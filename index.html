<title>화개장터 네컷</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gugi&family=Do+Hyeon&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">

<style>
  :root{
    --bg1:#2b0f1f;
    --bg2:#7a2036;
    --bg3:#d9622b;
    --bg4:#f4a637;
    --card:rgba(255,250,240,0.94);
    --ink:#341a12;
    --ink-soft:#7a5a4a;
    --accent:#e2472a;
    --accent-dark:#b6321a;
    --gold:#f2b53c;
    --plum:#6a2140;
    --line:rgba(52,26,18,0.10);
    --shadow:0 20px 45px rgba(43,15,31,0.35);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  body{
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(244,166,55,0.35), transparent 60%),
      linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 78%, var(--bg4) 100%);
    background-attachment:fixed;
  }
  .lantern{
    position:fixed;
    border-radius:50%;
    filter:blur(0.5px);
    opacity:0.5;
    pointer-events:none;
    background:radial-gradient(circle at 35% 30%, #ffd98a, #e2472a 70%);
    box-shadow:0 0 30px rgba(242,181,60,0.55);
  }
  .lantern::after{
    content:"";
    position:absolute;
    top:-14px;left:50%;
    width:2px;height:14px;
    background:rgba(255,255,255,0.4);
    transform:translateX(-50%);
  }

  .stage{
    position:relative;
    max-width:480px;
    margin:0 auto;
    min-height:100dvh;
    padding:22px 16px calc(22px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
  }

  .brand{
    text-align:center;
    padding-top:clamp(6px,3dvh,26px);
    margin-bottom:clamp(10px,3dvh,20px);
  }
  .brand .tag{
    display:inline-block;
    font-size:0.72rem;
    letter-spacing:0.14em;
    color:#ffe3b8;
    background:rgba(0,0,0,0.22);
    border:1px solid rgba(255,255,255,0.25);
    padding:5px 14px;
    border-radius:999px;
    margin-bottom:12px;
  }
  .brand h1{
    font-family:'Gugi',sans-serif;
    font-weight:400;
    font-size:clamp(2.2rem,9vw,3rem);
    line-height:1.1;
    margin:0;
    color:#fff6e6;
    text-shadow:0 3px 0 var(--accent-dark), 0 10px 24px rgba(0,0,0,0.35);
    letter-spacing:1px;
  }
  .brand p{
    margin:10px 0 0;
    font-size:0.95rem;
    color:#ffe9cf;
    opacity:0.92;
  }

  .card{
    flex:1;
    display:flex;
    flex-direction:column;
    background:var(--card);
    backdrop-filter:blur(14px);
    border-radius:28px;
    padding:22px 18px;
    box-shadow:var(--shadow);
    border:1px solid rgba(255,255,255,0.5);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    top:0;left:0;right:0;height:6px;
    background:linear-gradient(90deg,var(--accent),var(--gold),var(--plum),var(--accent));
    background-size:200% 100%;
    animation:shine 6s linear infinite;
  }
  @keyframes shine{ to{ background-position:200% 0; } }

  .pill-row{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .pill{
    font-size:0.78rem;
    font-weight:600;
    color:var(--ink);
    background:#fff;
    border:1px solid var(--line);
    padding:6px 12px;
    border-radius:999px;
  }

  .screen{ display:none; flex:1; flex-direction:column; }
  .screen.active{ display:flex; }

  /* HOME */
  #screen-home{ justify-content:space-between; gap:16px; }
  .qr-block{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    padding:16px 12px 6px;
  }
  .qr-frame{
    padding:10px;
    background:#fff;
    border-radius:18px;
    box-shadow:0 10px 24px rgba(52,26,18,0.16);
  }
  .qr-frame img{ display:block; width:150px; height:150px; }
  .qr-caption{
    font-size:0.88rem;
    text-align:center;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .qr-caption b{ color:var(--accent-dark); }

  .divider{
    display:flex; align-items:center; gap:10px;
    color:var(--ink-soft); font-size:0.78rem; font-weight:600;
    margin:2px 0;
  }
  .divider::before,.divider::after{ content:""; flex:1; height:1px; background:var(--line); }

  .btn{
    font-family:inherit;
    font-weight:700;
    font-size:1.05rem;
    border:none;
    border-radius:18px;
    padding:16px 18px;
    width:100%;
    cursor:pointer;
    color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));
    box-shadow:0 10px 20px rgba(226,71,42,0.35);
    transition:transform 0.12s ease, box-shadow 0.12s ease;
  }
  .btn:active{ transform:translateY(2px) scale(0.99); box-shadow:0 5px 12px rgba(226,71,42,0.3); }
  .btn.gold{ background:linear-gradient(135deg,var(--gold),#c98420); box-shadow:0 10px 20px rgba(198,140,30,0.35); }
  .btn.ghost{
    background:#fff;
    color:var(--ink);
    border:1.5px solid var(--line);
    box-shadow:none;
  }
  .btn.ghost:active{ transform:translateY(1px); }
  .btn-row{ display:flex; gap:10px; }
  .btn-row .btn{ flex:1; }

  .foot-note{
    text-align:center;
    font-size:0.72rem;
    color:var(--ink-soft);
    opacity:0.75;
    margin-top:2px;
  }

  /* CAMERA */
  #screen-camera{ gap:12px; }
  .camera-box{
    position:relative;
    flex:1;
    min-height:340px;
    border-radius:22px;
    overflow:hidden;
    background:#101014;
    box-shadow:0 12px 26px rgba(52,26,18,0.25);
  }
  video{
    width:100%; height:100%;
    object-fit:cover;
    filter:saturate(1.2) contrast(1.06) brightness(1.02);
  }
  video.mirror{ transform:scaleX(-1); }

  .dots{
    position:absolute; top:12px; left:0; right:0;
    display:flex; justify-content:center; gap:7px;
  }
  .dot{ width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,0.35); border:1.5px solid rgba(255,255,255,0.7); transition:background .2s; }
  .dot.done{ background:var(--gold); border-color:var(--gold); }
  .dot.active{ background:var(--accent); border-color:var(--accent); }

  .countdown{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Gugi',sans-serif;
    font-size:5.2rem; color:#fff;
    text-shadow:0 0 26px rgba(226,71,42,0.9), 0 4px 0 rgba(0,0,0,0.3);
    opacity:0; pointer-events:none;
  }
  .flash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }

  .cam-controls{ display:flex; gap:10px; }
  .icon-btn{
    flex:0 0 auto; width:54px;
    background:#fff; color:var(--ink);
    border:1.5px solid var(--line); box-shadow:none;
    font-size:1.3rem;
  }

  /* LOADING / ERROR */
  #screen-loading,#screen-error{ align-items:center; justify-content:center; text-align:center; gap:10px; }
  .spinner{
    width:44px; height:44px; border-radius:50%;
    border:4px solid var(--line); border-top-color:var(--accent);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .msg{ font-size:0.98rem; color:var(--ink-soft); line-height:1.6; }

  /* RESULT */
  #screen-result{ gap:12px; align-items:stretch; }
  .result-wrap{
    flex:1;
    display:flex; align-items:center; justify-content:center;
    min-height:0;
    background:repeating-linear-gradient(45deg,#f4ece0,#f4ece0 10px,#efe4d4 10px,#efe4d4 20px);
    border-radius:20px;
    padding:10px;
  }
  .result-wrap img{
    max-width:100%; max-height:56dvh;
    border-radius:10px;
    box-shadow:0 14px 30px rgba(52,26,18,0.28);
  }
  .save-status{
    text-align:center; font-size:0.82rem; color:var(--ink-soft);
    min-height:18px;
  }

  a.hidden-dl{ display:none; }
</style>

<div class="lantern" style="width:64px;height:64px;left:8%;top:14%;"></div>
<div class="lantern" style="width:44px;height:44px;right:10%;top:8%;"></div>
<div class="lantern" style="width:36px;height:36px;left:75%;top:30%;"></div>

<div class="stage">
  <div class="brand">
    <span class="tag">2026 중앙대학교 가을 축제</span>
    <h1>화개장터</h1>
    <p>가을밤 시장, 네컷에 담다 🎪</p>
  </div>

  <div class="card">
    <div class="pill-row">
      <span class="pill">🎪 화개장터</span>
      <span class="pill">🤡 삐에로</span>
      <span class="pill">📸 4컷</span>
    </div>

    <!-- HOME -->
    <div id="screen-home" class="screen active">
      <div class="qr-block">
        <div class="qr-frame"><img id="qrImg" alt="QR 코드"></div>
        <p class="qr-caption"><b>QR을 스캔</b>하면 내 폰 카메라로<br>바로 촬영할 수 있어요</p>
      </div>

      <div>
        <div class="divider">또는</div>
        <button id="btnStart" class="btn">📸 이 화면에서 바로 찍기</button>
        <p class="foot-note">사진은 서버로 전송되지 않고 이 화면 안에서만 만들어져요</p>
      </div>
    </div>

    <!-- CAMERA -->
    <div id="screen-camera" class="screen">
      <div class="camera-box" id="cameraBox">
        <video id="video" autoplay playsinline muted></video>
        <div class="dots" id="dots"></div>
        <div class="countdown" id="countdown"></div>
        <div class="flash" id="flash"></div>
      </div>
      <div class="cam-controls">
        <button class="btn icon-btn" id="btnFlip">🔄</button>
        <button class="btn" id="btnCapture">촬영 시작 (4컷)</button>
      </div>
      <button class="btn ghost" id="btnCancel">처음으로</button>
    </div>

    <!-- LOADING -->
    <div id="screen-loading" class="screen">
      <div class="spinner"></div>
      <p class="msg">네컷 만드는 중...</p>
    </div>

    <!-- ERROR -->
    <div id="screen-error" class="screen">
      <p class="msg" id="errorMsg">카메라를 열 수 없어요.</p>
      <button class="btn ghost" id="btnBackFromError">처음으로</button>
    </div>

    <!-- RESULT -->
    <div id="screen-result" class="screen">
      <div class="result-wrap"><img id="resultImg" alt="화개장터 네컷 결과"></div>
      <p class="save-status" id="saveStatus"> </p>
      <div class="btn-row">
        <button class="btn gold" id="btnSave">💾 이미지 저장</button>
        <button class="btn ghost" id="btnRetake">🔁 다시 찍기</button>
      </div>
    </div>
  </div>
</div>

<a id="dlLink" class="hidden-dl" download="hwagae-4cut.png"></a>

<script>
(function(){
  const screens = ['home','camera','loading','error','result'];
  function show(name){
    screens.forEach(s=>{
      document.getElementById('screen-'+s).classList.toggle('active', s===name);
    });
  }

  const video = document.getElementById('video');
  const btnStart = document.getElementById('btnStart');
  const btnCapture = document.getElementById('btnCapture');
  const btnFlip = document.getElementById('btnFlip');
  const btnCancel = document.getElementById('btnCancel');
  const btnBackFromError = document.getElementById('btnBackFromError');
  const btnRetake = document.getElementById('btnRetake');
  const btnSave = document.getElementById('btnSave');
  const countdownEl = document.getElementById('countdown');
  const flashEl = document.getElementById('flash');
  const dotsEl = document.getElementById('dots');
  const resultImg = document.getElementById('resultImg');
  const errorMsg = document.getElementById('errorMsg');
  const saveStatus = document.getElementById('saveStatus');
  const dlLink = document.getElementById('dlLink');

  let stream = null;
  let facingMode = 'user';
  let shots = [];
  let resultDataUrl = '';

  function buildDots(){
    dotsEl.innerHTML = '';
    for(let i=0;i<4;i++){
      const d = document.createElement('div');
      d.className = 'dot';
      d.id = 'dot'+i;
      dotsEl.appendChild(d);
    }
  }

  async function startStream(){
    if(stream){ stream.getTracks().forEach(t=>t.stop()); }
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode: facingMode, width:{ideal:720}, height:{ideal:960} },
        audio:false
      });
      video.srcObject = stream;
      video.classList.toggle('mirror', facingMode === 'user');
      return true;
    }catch(e){
      errorMsg.textContent = '카메라 권한을 확인해주세요. 이 페이지를 폰 브라우저에서 직접 열면 더 잘 작동해요.';
      show('error');
      return false;
    }
  }

  btnStart.addEventListener('click', async ()=>{
    shots = [];
    buildDots();
    show('camera');
    await startStream();
  });

  btnBackFromError.addEventListener('click', ()=> show('home'));
  btnCancel.addEventListener('click', ()=>{
    if(stream){ stream.getTracks().forEach(t=>t.stop()); }
    show('home');
  });

  btnFlip.addEventListener('click', async ()=>{
    facingMode = facingMode === 'user' ? 'environment' : 'user';
    await startStream();
  });

  function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

  async function runCountdownAndShoot(index){
    for(const n of [3,2,1]){
      countdownEl.textContent = n;
      countdownEl.style.opacity = 1;
      await sleep(650);
    }
    countdownEl.style.opacity = 0;
    flashEl.style.transition = 'none';
    flashEl.style.opacity = 0.85;
    requestAnimationFrame(()=>{
      flashEl.style.transition = 'opacity 0.3s ease';
      flashEl.style.opacity = 0;
    });

    const c = document.createElement('canvas');
    const vw = video.videoWidth || 720, vh = video.videoHeight || 960;
    const targetRatio = 3/4;
    let sw = vw, sh = vh, sx = 0, sy = 0;
    if (vw/vh > targetRatio){ sw = vh * targetRatio; sx = (vw - sw)/2; }
    else { sh = vw / targetRatio; sy = (vh - sh)/2; }
    c.width = 480; c.height = 640;
    const ctx = c.getContext('2d');
    ctx.filter = 'saturate(1.2) contrast(1.06) brightness(1.02)';
    if (facingMode === 'user'){ ctx.translate(c.width,0); ctx.scale(-1,1); }
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, c.width, c.height);
    shots.push(c);

    const dot = document.getElementById('dot'+index);
    dot.classList.remove('active');
    dot.classList.add('done');
  }

  btnCapture.addEventListener('click', async ()=>{
    btnCapture.disabled = true;
    btnFlip.disabled = true;
    shots = [];
    buildDots();
    for(let i=0;i<4;i++){
      document.getElementById('dot'+i).classList.add('active');
      await runCountdownAndShoot(i);
      await sleep(350);
    }
    if(stream){ stream.getTracks().forEach(t=>t.stop()); }
    btnCapture.disabled = false;
    btnFlip.disabled = false;
    show('loading');
    await sleep(150);
    composeStrip();
  });

  function loadFont(){
    return Promise.all([
      document.fonts.load('400 44px "Gugi"'),
      document.fonts.load('700 20px "Pretendard"')
    ]).catch(()=>{});
  }

  function drawLantern(ctx,x,y,r,hue1,hue2){
    ctx.save();
    const g = ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r);
    g.addColorStop(0,hue1); g.addColorStop(1,hue2);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x,y-r-16); ctx.lineTo(x,y-r); ctx.stroke();
    ctx.restore();
  }

  function drawConfetti(ctx, w, h, seedOffset){
    const colors = ['#e2472a','#f2b53c','#6a2140','#ffd98a'];
    let s = seedOffset;
    function rand(){ s = (s*9301+49297) % 233280; return s/233280; }
    for(let i=0;i<22;i++){
      const x = rand()*w, y = rand()*h;
      ctx.fillStyle = colors[Math.floor(rand()*colors.length)];
      ctx.save();
      ctx.translate(x,y);
      ctx.rotate(rand()*Math.PI);
      if (rand() > 0.5){ ctx.fillRect(-3,-3,6,6); }
      else { ctx.beginPath(); ctx.arc(0,0,3,0,Math.PI*2); ctx.fill(); }
      ctx.restore();
    }
  }

  async function composeStrip(){
    await loadFont();
    const photoW = 480, photoH = 640, gap = 16, pad = 26;
    const headerH = 150, footerH = 96;
    const W = photoW + pad*2;
    const H = headerH + 4*photoH + 3*gap + footerH;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');

    const bgGrad = ctx.createLinearGradient(0,0,0,H);
    bgGrad.addColorStop(0,'#3a1526');
    bgGrad.addColorStop(0.22,'#7a2036');
    bgGrad.addColorStop(0.55,'#d9622b');
    bgGrad.addColorStop(1,'#f6c869');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0,0,W,H);

    drawLantern(ctx, 46, 46, 16, '#ffe6a8', '#e2472a');
    drawLantern(ctx, W-46, 50, 12, '#ffe6a8', '#f2b53c');
    drawConfetti(ctx, W, headerH, 11);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff6e6';
    ctx.font = '400 46px "Gugi"';
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.35)';
    ctx.shadowBlur = 6;
    ctx.shadowOffsetY = 3;
    ctx.fillText('화개장터', W/2, headerH - 58);
    ctx.restore();

    ctx.font = '600 19px "Pretendard"';
    ctx.fillStyle = '#ffe9cf';
    ctx.fillText('2026 중앙대학교 가을 축제', W/2, headerH - 28);

    let y = headerH;
    shots.forEach((shotCanvas)=>{
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.25)';
      ctx.shadowBlur = 12;
      ctx.drawImage(shotCanvas, pad, y, photoW, photoH);
      ctx.restore();
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 5;
      ctx.strokeRect(pad, y, photoW, photoH);
      y += photoH + gap;
    });

    const footerY = H - footerH;
    drawConfetti(ctx, W, footerH, 31);
    ctx.font = '700 20px "Pretendard"';
    ctx.fillStyle = '#fff6e6';
    ctx.fillText('HWAGAE MARKET × PIERROT', W/2, footerY + 40);
    const d = new Date();
    const dateStr = d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');
    ctx.font = '500 15px "Pretendard"';
    ctx.fillStyle = '#ffe9cf';
    ctx.fillText(dateStr, W/2, footerY + 64);

    resultDataUrl = cv.toDataURL('image/png');
    resultImg.src = resultDataUrl;
    saveStatus.textContent = '';
    show('result');
  }

  btnSave.addEventListener('click', async ()=>{
    if(!resultDataUrl) return;
    try{
      const res = await fetch(resultDataUrl);
      const blob = await res.blob();
      if (navigator.canShare && navigator.canShare({ files:[new File([blob],'hwagae-4cut.png',{type:'image/png'})] })){
        try{
          await navigator.share({ files:[new File([blob],'hwagae-4cut.png',{type:'image/png'})], title:'화개장터 네컷' });
          saveStatus.textContent = '공유 완료!';
          return;
        }catch(shareErr){ /* fall through to download */ }
      }
      const url = URL.createObjectURL(blob);
      dlLink.href = url;
      dlLink.click();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      saveStatus.textContent = '저장됐어요! (안 되면 사진을 길게 눌러 저장하세요)';
    }catch(e){
      saveStatus.textContent = '사진을 길게 눌러서 저장해주세요';
    }
  });

  btnRetake.addEventListener('click', ()=>{ show('home'); });
