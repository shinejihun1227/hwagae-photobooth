
<title>화개장터 네컷</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gugi&family=Do+Hyeon&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">

<style>
  :root{
    --bg1:#2b0f1f;
    --bg2:#7a2036;
    --bg3:#d9622b;
    --bg4:#f4a637;
    --card:rgba(255,250,240,0.94);
    --ink:#341a12;
    --ink-soft:#7a5a4a;
    --accent:#e2472a;
    --accent-dark:#b6321a;
    --gold:#f2b53c;
    --plum:#6a2140;
    --line:rgba(52,26,18,0.10);
    --shadow:0 20px 45px rgba(43,15,31,0.35);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  body{
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(244,166,55,0.35), transparent 60%),
      linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 78%, var(--bg4) 100%);
    background-attachment:fixed;
  }
  .lantern{
    position:fixed;
    border-radius:50%;
    filter:blur(0.5px);
    opacity:0.5;
    pointer-events:none;
    background:radial-gradient(circle at 35% 30%, #ffd98a, #e2472a 70%);
    box-shadow:0 0 30px rgba(242,181,60,0.55);
  }
  .lantern::after{
    content:"";
    position:absolute;
    top:-14px;left:50%;
    width:2px;height:14px;
    background:rgba(255,255,255,0.4);
    transform:translateX(-50%);
  }

  .stage{
    position:relative;
    max-width:480px;
    margin:0 auto;
    min-height:100dvh;
    padding:22px 16px calc(22px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
  }

  .brand{
    text-align:center;
    padding-top:clamp(6px,3dvh,26px);
    margin-bottom:clamp(10px,3dvh,20px);
  }
  .brand .tag{
    display:inline-block;
    font-size:0.72rem;
    letter-spacing:0.14em;
    color:#ffe3b8;
    background:rgba(0,0,0,0.22);
    border:1px solid rgba(255,255,255,0.25);
    padding:5px 14px;
    border-radius:999px;
    margin-bottom:12px;
  }
  .brand h1{
    font-family:'Gugi',sans-serif;
    font-weight:400;
    font-size:clamp(2.2rem,9vw,3rem);
    line-height:1.1;
    margin:0;
    color:#fff6e6;
    text-shadow:0 6px 18px rgba(0,0,0,0.4);
    letter-spacing:0;
  }
  .brand p{
    margin:10px 0 0;
    font-size:0.95rem;
    color:#ffe9cf;
    opacity:0.92;
  }
  .mascot-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:4px;
  }
  .mascot-frame{ position:relative; display:inline-block; }
  .mascot-photo{
    width:84px; height:auto; display:block;
    border-radius:14px;
    box-shadow:0 10px 18px rgba(0,0,0,0.35);
    border:2px solid rgba(255,255,255,0.85);
  }
  .mascot-ribbon{
    position:absolute; top:-9px; left:50%;
    transform:translateX(-50%) rotate(-4deg);
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));
    color:#fff; font-size:0.52rem; font-weight:800;
    padding:3px 8px; border-radius:7px;
    box-shadow:0 3px 7px rgba(0,0,0,0.35);
    white-space:nowrap;
  }
  .mascot-lantern-deco{
    position:absolute; bottom:-8px; right:-12px;
    font-size:1.3rem;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,0.4));
  }
  .mascot-confetti{
    position:absolute; top:-4px; left:-14px;
    font-size:0.9rem;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,0.35));
  }

  .card{
    flex:1;
    display:flex;
    flex-direction:column;
    background:var(--card);
    backdrop-filter:blur(14px);
    border-radius:28px;
    padding:22px 18px;
    box-shadow:var(--shadow);
    border:1px solid rgba(255,255,255,0.5);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    top:0;left:0;right:0;height:6px;
    background:linear-gradient(90deg,var(--accent),var(--gold),var(--plum),var(--accent));
    background-size:200% 100%;
    animation:shine 6s linear infinite;
  }
  @keyframes shine{ to{ background-position:200% 0; } }

  .pill-row{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .pill{
    font-size:0.78rem;
    font-weight:600;
    color:var(--ink);
    background:#fff;
    border:1px solid var(--line);
    padding:6px 12px;
    border-radius:999px;
  }

  .screen{ display:none; flex:1; flex-direction:column; }
  .screen.active{ display:flex; }

  /* HOME */
  #screen-home{ justify-content:center; gap:30px; }
  .qr-block{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    padding:16px 12px 6px;
  }
  .qr-frame{
    padding:10px;
    background:#fff;
    border-radius:18px;
    box-shadow:0 10px 24px rgba(52,26,18,0.16);
  }
  .qr-frame img{ display:block; width:150px; height:150px; }
  .qr-caption{
    font-size:0.88rem;
    text-align:center;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .qr-caption b{ color:var(--accent-dark); }

  .divider{
    display:flex; align-items:center; gap:10px;
    color:var(--ink-soft); font-size:0.78rem; font-weight:600;
    margin:2px 0;
  }
  .divider::before,.divider::after{ content:""; flex:1; height:1px; background:var(--line); }

  .btn{
    font-family:inherit;
    font-weight:700;
    font-size:1.05rem;
    border:none;
    border-radius:18px;
    padding:16px 18px;
    width:100%;
    cursor:pointer;
    color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));
    box-shadow:0 10px 20px rgba(226,71,42,0.35);
    transition:transform 0.12s ease, box-shadow 0.12s ease;
  }
  .btn:active{ transform:translateY(2px) scale(0.99); box-shadow:0 5px 12px rgba(226,71,42,0.3); }
  .btn.gold{ background:linear-gradient(135deg,var(--gold),#c98420); box-shadow:0 10px 20px rgba(198,140,30,0.35); }
  .btn.ghost{
    background:#fff;
    color:var(--ink);
    border:1.5px solid var(--line);
    box-shadow:none;
  }
  .btn.ghost:active{ transform:translateY(1px); }
  .btn-row{ display:flex; gap:10px; }
  .btn-row .btn{ flex:1; }

  .foot-note{
    text-align:center;
    font-size:0.72rem;
    color:var(--ink-soft);
    opacity:0.75;
    margin-top:2px;
  }

  /* CAMERA */
  #screen-camera{ gap:12px; justify-content:center; }
  .camera-box{
    position:relative;
    width:100%;
    aspect-ratio:3/4;
    max-height:56dvh;
    margin:0 auto;
    border-radius:22px;
    overflow:hidden;
    background:#101014;
    box-shadow:0 12px 26px rgba(52,26,18,0.25);
  }
  video{
    width:100%; height:100%;
    object-fit:cover;
    filter:saturate(1.18) contrast(1.05) brightness(1.02);
    transition:filter 0.2s ease;
  }
  video.mirror{ transform:scaleX(-1); }
  .glow-overlay{
    position:absolute; inset:0;
    background:radial-gradient(120% 90% at 50% 35%, rgba(255,255,255,0.4), transparent 65%);
    mix-blend-mode:soft-light;
    opacity:0;
    transition:opacity 0.2s ease;
    pointer-events:none;
  }
  .glow-overlay.on{ opacity:1; }

  .filter-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:2px 2px 4px;
    scrollbar-width:none;
  }
  .filter-row::-webkit-scrollbar{ display:none; }
  .filter-chip{
    flex:0 0 auto;
    font-family:inherit;
    font-size:0.82rem;
    font-weight:600;
    color:var(--ink);
    background:#fff;
    border:1.5px solid var(--line);
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
  }
  .filter-chip.active{
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));
    border-color:transparent;
    color:#fff;
  }

  /* FRAME SELECT */
  #screen-frame{ gap:14px; }
  .frame-title{ text-align:center; font-size:0.95rem; font-weight:700; color:var(--ink); margin:0; }
  .frame-sub{ text-align:center; font-size:0.78rem; color:var(--ink-soft); margin:-6px 0 2px; }
  .frame-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .frame-card{
    border:2.5px solid transparent;
    border-radius:16px;
    padding:8px;
    background:#fff;
    cursor:pointer;
    text-align:center;
    box-shadow:0 6px 14px rgba(52,26,18,0.10);
    transition:border-color .15s ease, transform .1s ease;
  }
  .frame-card canvas{ width:100%; height:auto; border-radius:10px; display:block; }
  .frame-card span{ display:block; margin-top:6px; font-size:0.8rem; font-weight:700; color:var(--ink); }
  .frame-card.active{ border-color:var(--accent); transform:translateY(-2px); }

  .dots{
    position:absolute; top:12px; left:0; right:0;
    display:flex; justify-content:center; gap:7px;
  }
  .dot{ width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,0.35); border:1.5px solid rgba(255,255,255,0.7); transition:background .2s; }
  .dot.done{ background:var(--gold); border-color:var(--gold); }
  .dot.active{ background:var(--accent); border-color:var(--accent); }

  .countdown{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Gugi',sans-serif;
    font-size:5.2rem; color:#fff;
    text-shadow:0 0 26px rgba(226,71,42,0.9), 0 4px 0 rgba(0,0,0,0.3);
    opacity:0; pointer-events:none;
  }
  .flash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }

  .cam-controls{ display:flex; gap:10px; }
  .icon-btn{
    flex:0 0 auto; width:54px;
    background:#fff; color:var(--ink);
    border:1.5px solid var(--line); box-shadow:none;
    font-size:1.3rem;
  }

  /* LOADING / ERROR */
  #screen-loading,#screen-error{ align-items:center; justify-content:center; text-align:center; gap:10px; }
  .spinner{
    width:44px; height:44px; border-radius:50%;
    border:4px solid var(--line); border-top-color:var(--accent);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .msg{ font-size:0.98rem; color:var(--ink-soft); line-height:1.6; }

  /* RESULT */
  #screen-result{ gap:12px; align-items:stretch; }
  .result-wrap{
    flex:1;
    display:flex; align-items:center; justify-content:center;
    min-height:0;
    background:repeating-linear-gradient(45deg,#f4ece0,#f4ece0 10px,#efe4d4 10px,#efe4d4 20px);
    border-radius:20px;
    padding:10px;
  }
  .result-wrap img{
    max-width:100%; max-height:56dvh;
    border-radius:10px;
    box-shadow:0 14px 30px rgba(52,26,18,0.28);
  }
  .save-status{
    text-align:center; font-size:0.82rem; color:var(--ink-soft);
    min-height:18px;
  }

  a.hidden-dl{ display:none; }
</style>

    <div class="mascot-wrap">
      <div class="mascot-frame">
        <img src="image.png" alt="푸앙이" class="mascot-photo">
        <span class="mascot-ribbon">화개장터×삐에로</span>

    </div>

    <!-- HOME -->
    <div id="screen-home" class="screen active">
      <div class="qr-block">
        <div class="qr-frame"><img id="qrImg" alt="QR 코드"></div>
        <p class="qr-caption"><b>QR을 스캔</b>하면 내 폰 카메라로<br>바로 촬영할 수 있어요</p>

      <div>

    <!-- FRAME SELECT -->

  </div>

<script>
(function(){
  // ---------- 촬영 필터 ----------
  const FILTERS = [
    { key:'soft', label:'✨ 뽀샤시', css:'brightness(1.14) contrast(0.88) saturate(1.12) blur(0.5px)', glow:true },
    { key:'clear', label:'🎬 선명', css:'saturate(1.2) contrast(1.08) brightness(1.02)', glow:false },
    { key:'film', label:'📼 필름', css:'sepia(0.22) contrast(1.05) saturate(1.05) brightness(1.02)', glow:false },
    { key:'mono', label:'⚫ 흑백', css:'grayscale(1) contrast(1.12) brightness(1.02)', glow:false }
  ];
  let currentFilter = FILTERS[0];

  const screens = ['home','frame','camera','loading','error','result'];
  function show(name){
    screens.forEach(s=>{
      document.getElementById('screen-'+s).classList.toggle('active', s===name);
    });
  }

  const video = document.getElementById('video');
  const btnStart = document.getElementById('btnStart');
  const btnFrameBack = document.getElementById('btnFrameBack');
  const btnFrameNext = document.getElementById('btnFrameNext');
  const frameGrid = document.getElementById('frameGrid');
  const btnCapture = document.getElementById('btnCapture');
  const btnFlip = document.getElementById('btnFlip');
  const btnCancel = document.getElementById('btnCancel');
  const btnBackFromError = document.getElementById('btnBackFromError');
  const btnRetake = document.getElementById('btnRetake');
  const btnSave = document.getElementById('btnSave');
  const countdownEl = document.getElementById('countdown');
  const flashEl = document.getElementById('flash');
  const glowOverlay = document.getElementById('glowOverlay');
  const filterRow = document.getElementById('filterRow');
  const dotsEl = document.getElementById('dots');
  const resultImg = document.getElementById('resultImg');
  const errorMsg = document.getElementById('errorMsg');
  const saveStatus = document.getElementById('saveStatus');
  const dlLink = document.getElementById('dlLink');

  let stream = null;
  let facingMode = 'user';
  let shots = [];
  let resultDataUrl = '';

  function buildDots(){
    dotsEl.innerHTML = '';
    for(let i=0;i<4;i++){
      const d = document.createElement('div');
      d.className = 'dot';
      d.id = 'dot'+i;
      dotsEl.appendChild(d);
    }
  }

  function applyFilter(f){
    currentFilter = f;
    video.style.filter = f.css;
    glowOverlay.classList.toggle('on', !!f.glow);
    filterRow.querySelectorAll('.filter-chip').forEach(chip=>{
      chip.classList.toggle('active', chip.dataset.key === f.key);
    });
  }

  function buildFilterRow(){
    filterRow.innerHTML = '';
    FILTERS.forEach(f=>{
      const chip = document.createElement('button');
      chip.className = 'filter-chip' + (f.key===currentFilter.key ? ' active' : '');
      chip.type = 'button';
      chip.textContent = f.label;
      chip.dataset.key = f.key;
      chip.addEventListener('click', ()=> applyFilter(f));
      filterRow.appendChild(chip);
    });
  }
  buildFilterRow();
  applyFilter(currentFilter);

  async function startStream(){
    if(stream){ stream.getTracks().forEach(t=>t.stop()); }
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode: facingMode, width:{ideal:720}, height:{ideal:960} },
        audio:false
      });
      video.srcObject = stream;
      video.classList.toggle('mirror', facingMode === 'user');
      return true;
    }catch(e){
      errorMsg.textContent = '카메라 권한을 확인해주세요. 이 페이지를 폰 브라우저에서 직접 열면 더 잘 작동해요.';
      show('error');
      return false;
    }
  }

  btnStart.addEventListener('click', ()=>{
    buildFrameGrid();
    show('frame');
  });

  btnFrameBack.addEventListener('click', ()=> show('home'));
  btnFrameNext.addEventListener('click', async ()=>{
    shots = [];
    buildDots();
    show('camera');
    await startStream();
  });

  btnBackFromError.addEventListener('click', ()=> show('home'));
  btnCancel.addEventListener('click', ()=>{
    if(stream){ stream.getTracks().forEach(t=>t.stop()); }
    show('home');
  });

  btnFlip.addEventListener('click', async ()=>{
    facingMode = facingMode === 'user' ? 'environment' : 'user';
    await startStream();
  });

  function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

  async function runCountdownAndShoot(index){
    for(const n of [3,2,1]){
      countdownEl.textContent = n;
      countdownEl.style.opacity = 1;
      await sleep(650);
    }
    countdownEl.style.opacity = 0;
    flashEl.style.transition = 'none';
    flashEl.style.opacity = 0.85;
    requestAnimationFrame(()=>{
      flashEl.style.transition = 'opacity 0.3s ease';
      flashEl.style.opacity = 0;
    });

    const c = document.createElement('canvas');
    const vw = video.videoWidth || 720, vh = video.videoHeight || 960;
    const targetRatio = 3/4;
    let sw = vw, sh = vh, sx = 0, sy = 0;
    if (vw/vh > targetRatio){ sw = vh * targetRatio; sx = (vw - sw)/2; }
    else { sh = vw / targetRatio; sy = (vh - sh)/2; }
    c.width = 480; c.height = 640;
    const ctx = c.getContext('2d');
    ctx.filter = currentFilter.css;
    if (facingMode === 'user'){ ctx.translate(c.width,0); ctx.scale(-1,1); }
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, c.width, c.height);
    ctx.setTransform(1,0,0,1,0,0);
    ctx.filter = 'none';
    if (currentFilter.glow){
      const g = ctx.createRadialGradient(c.width/2,c.height*0.4,10,c.width/2,c.height*0.4,c.width*0.75);
      g.addColorStop(0,'rgba(255,255,255,0.45)');
      g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.globalCompositeOperation = 'soft-light';
      ctx.fillStyle = g;
      ctx.fillRect(0,0,c.width,c.height);
      ctx.globalCompositeOperation = 'source-over';
    }
    shots.push(c);

    const dot = document.getElementById('dot'+index);
    dot.classList.remove('active');
    dot.classList.add('done');
  }

  btnCapture.addEventListener('click', async ()=>{
    btnCapture.disabled = true;
    btnFlip.disabled = true;
    shots = [];
    buildDots();
    for(let i=0;i<4;i++){
      document.getElementById('dot'+i).classList.add('active');
      await runCountdownAndShoot(i);
      await sleep(350);
    }
    if(stream){ stream.getTracks().forEach(t=>t.stop()); }
    btnCapture.disabled = false;
    btnFlip.disabled = false;
    show('loading');
    await sleep(150);
    composeStrip();
  });

  function loadFont(){
    return Promise.all([
      document.fonts.load('400 44px "Gugi"'),
      document.fonts.load('700 20px "Pretendard"')
    ]).catch(()=>{});
  }

  function drawLantern(ctx,x,y,r,hue1,hue2){
    ctx.save();
    const g = ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r);
    g.addColorStop(0,hue1); g.addColorStop(1,hue2);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x,y-r-16); ctx.lineTo(x,y-r); ctx.stroke();
    ctx.restore();
  }

  function drawConfetti(ctx, w, h, seedOffset){
    const colors = ['#e2472a','#f2b53c','#6a2140','#ffd98a'];
    let s = seedOffset;
    function rand(){ s = (s*9301+49297) % 233280; return s/233280; }
    for(let i=0;i<22;i++){
      const x = rand()*w, y = rand()*h;
      ctx.fillStyle = colors[Math.floor(rand()*colors.length)];
      ctx.save();
      ctx.translate(x,y);
      ctx.rotate(rand()*Math.PI);
      if (rand() > 0.5){ ctx.fillRect(-3,-3,6,6); }
      else { ctx.beginPath(); ctx.arc(0,0,3,0,Math.PI*2); ctx.fill(); }
      ctx.restore();
    }
  }

  function dateStr(){
    const d = new Date();
    return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');
  }

  function drawStripeBand(ctx,x,y,w,h,bg,stripeColor,sw){
    ctx.save();
    ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
    ctx.fillStyle = bg; ctx.fillRect(x,y,w,h);
    ctx.fillStyle = stripeColor;
    const diag = w+h;
    for(let i=-h; i<diag; i+=sw*2){
      ctx.beginPath();
      ctx.moveTo(x+i,y);
      ctx.lineTo(x+i+sw,y);
      ctx.lineTo(x+i+sw-h,y+h);
      ctx.lineTo(x+i-h,y+h);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function drawPolkaDots(ctx,x,y,w,h,color,count,seed){
    let s = seed || 7;
    function rand(){ s = (s*9301+49297) % 233280; return s/233280; }
    ctx.fillStyle = color;
    for(let i=0;i<count;i++){
      const px = x + rand()*w, py = y + rand()*h, r = 2 + rand()*3;
      ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2); ctx.fill();
    }
  }

  function drawNeonDots(ctx,x,y,w,count,colors,seed){
    let s = seed || 3;
    function rand(){ s = (s*9301+49297) % 233280; return s/233280; }
    for(let i=0;i<count;i++){
      const px = x + (w/Math.max(count-1,1))*i;
      const py = y + Math.sin(i*1.3 + s)*5;
      const c = colors[i%colors.length];
      ctx.save();
      ctx.shadowColor = c; ctx.shadowBlur = 8;
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(px,py,3.2,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }

  // ---------- 프레임(테마) 정의 ----------
  const FRAME_LIST = [
    { key:'hwagae', label:'🏮 화개장터' },
    { key:'pierrot', label:'🤡 삐에로 서커스' },
    { key:'mono', label:'🤍 미니멀 화이트' },
    { key:'night', label:'🌙 나이트마켓' }
  ];
  let currentFrameKey = 'hwagae';

  const FRAME_THEMES = {
    hwagae:{
      photoBorder:'rgba(255,255,255,0.85)',
      paintBackground(ctx,w,h){
        const g = ctx.createLinearGradient(0,0,0,h);
        g.addColorStop(0,'#3a1526'); g.addColorStop(0.22,'#7a2036'); g.addColorStop(0.55,'#d9622b'); g.addColorStop(1,'#f6c869');
        ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
      },
      swatchAccent(ctx,w,h){
        drawLantern(ctx, w*0.18, h*0.08, w*0.05, '#ffe6a8', '#e2472a');

        drawLantern(ctx, w*0.9, headerH*0.36, 12, '#ffe6a8', '#f2b53c');
        drawConfetti(ctx, w, headerH, 11);
        ctx.textAlign = 'center';
        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 3;
        ctx.fillStyle = '#fff6e6'; ctx.font = '400 46px "Gugi"';
        ctx.fillText('화개장터', w/2, headerH-58);
        ctx.restore();
        ctx.font = '600 19px "Pretendard"'; ctx.fillStyle = '#ffe9cf';
        ctx.fillText('2026 중앙대학교 가을 축제', w/2, headerH-28);
      },
      paintFooter(ctx,w,footerY,footerH,mascotImg){
        drawConfetti(ctx, w, footerH, 31);

        drawMascotImg(ctx, mascotImg, w/2, footerY+4, 64);

        ctx.fillText('HWAGAE MARKET × PIERROT', w/2, footerY+82);
        ctx.font = '500 14px "Pretendard"'; ctx.fillStyle = '#ffe9cf';
        ctx.fillText(dateStr(), w/2, footerY+104);
      }
    },
    pierrot:{
      photoBorder:'#e2472a',
      paintBackground(ctx,w,h){
        ctx.fillStyle = '#fbf1e0'; ctx.fillRect(0,0,w,h);
      },
      swatchAccent(ctx,w,h){
        drawStripeBand(ctx,0,0,w,h*0.14,'#fbf1e0','#e2472a', w*0.09);
        drawStripeBand(ctx,0,h*0.86,w,h*0.14,'#fbf1e0','#e2472a', w*0.09);
      },
      paintHeader(ctx,w,headerH){
        drawStripeBand(ctx,0,0,w,headerH*0.34,'#fbf1e0','#e2472a', 26);
        drawPolkaDots(ctx,0,headerH*0.34,w,headerH*0.66,'#f2b53c',26,17);
        ctx.textAlign = 'center';
        ctx.save();
        ctx.strokeStyle = '#e2472a'; ctx.lineWidth = 3;
        ctx.font = '400 44px "Gugi"';
        ctx.strokeText('화개장터', w/2, headerH-56);
        ctx.fillStyle = '#fff'; ctx.fillText('화개장터', w/2, headerH-56);
        ctx.restore();
        ctx.font = '700 16px "Pretendard"'; ctx.fillStyle = '#b6321a';
        ctx.fillText('PIERROT CIRCUS NIGHT', w/2, headerH-26);
      },
      paintFooter(ctx,w,footerY,footerH,mascotImg){
        drawPolkaDots(ctx,0,footerY,w,footerH*0.55,'#f2b53c',22,29);
        drawStripeBand(ctx,0,footerY+footerH*0.72,w,footerH*0.28,'#fbf1e0','#e2472a',26);
        ctx.textAlign = 'center';
        drawMascotImg(ctx, mascotImg, w/2, footerY+2, 60);
        ctx.font = '700 18px "Pretendard"'; ctx.fillStyle = '#341a12';
        ctx.fillText('HWAGAE × PIERROT', w/2, footerY+76);
        ctx.font = '500 13px "Pretendard"'; ctx.fillStyle = '#7a5a4a';
        ctx.fillText(dateStr(), w/2, footerY+98);
      }
    },
    mono:{
      photoBorder:'#c9a227',
      paintBackground(ctx,w,h){
        ctx.fillStyle = '#fbf9f4'; ctx.fillRect(0,0,w,h);
        ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 2;
        ctx.strokeRect(14,14,w-28,h-28);
      },
      swatchAccent(){},
      paintHeader(ctx,w,headerH){
        ctx.textAlign = 'center';
        ctx.fillStyle = '#341a12'; ctx.font = '400 38px "Gugi"';
        ctx.fillText('화개장터', w/2, headerH-56);
        ctx.font = '600 15px "Pretendard"'; ctx.fillStyle = '#7a5a4a';
        ctx.fillText('2026 중앙대학교 가을 축제', w/2, headerH-30);
      },
      paintFooter(ctx,w,footerY,footerH,mascotImg){
        ctx.strokeStyle = 'rgba(52,26,18,0.15)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(w*0.28, footerY+2); ctx.lineTo(w*0.72, footerY+2); ctx.stroke();
        ctx.textAlign = 'center';
        drawMascotImg(ctx, mascotImg, w/2, footerY+10, 50);
        ctx.font = '600 16px "Pretendard"'; ctx.fillStyle = '#341a12';
        ctx.fillText('HWAGAE MARKET', w/2, footerY+76);
        ctx.font = '500 13px "Pretendard"'; ctx.fillStyle = '#a08770';
        ctx.fillText(dateStr(), w/2, footerY+96);
      }
    },
    night:{
      photoBorder:'rgba(0,232,255,0.85)',
      paintBackground(ctx,w,h){
        const g = ctx.createLinearGradient(0,0,0,h);
        g.addColorStop(0,'#0c0f2e'); g.addColorStop(0.5,'#1b1442'); g.addColorStop(1,'#2a1b52');
        ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
      },
      swatchAccent(ctx,w,h){
        drawNeonDots(ctx,8,h*0.06,w-16,6,['#00e8ff','#ff4fd8','#ffd93c'],5);
      },
      paintHeader(ctx,w,headerH){
        drawNeonDots(ctx,20,26,w-40,10,['#00e8ff','#ff4fd8','#ffd93c'],4);
        ctx.textAlign = 'center';
        ctx.save();
        ctx.shadowColor = '#ff4fd8'; ctx.shadowBlur = 16;
        ctx.fillStyle = '#fff'; ctx.font = '400 44px "Gugi"';
        ctx.fillText('화개장터', w/2, headerH-56);
        ctx.restore();
        ctx.font = '600 15px "Pretendard"'; ctx.fillStyle = '#8fd8ff';
        ctx.fillText('NIGHT MARKET × PIERROT', w/2, headerH-28);
      },
      paintFooter(ctx,w,footerY,footerH,mascotImg){
        drawNeonDots(ctx,20,footerY+footerH-22,w-40,10,['#00e8ff','#ff4fd8','#ffd93c'],9);
        ctx.textAlign = 'center';
        drawMascotImg(ctx, mascotImg, w/2, footerY+2, 60);
        ctx.font = '700 18px "Pretendard"'; ctx.fillStyle = '#fff';
        ctx.fillText('HWAGAE MARKET', w/2, footerY+76);
        ctx.font = '500 13px "Pretendard"'; ctx.fillStyle = '#8fd8ff';
        ctx.fillText(dateStr(), w/2, footerY+96);
      }
    }
  };

  function drawThemeSwatch(ctx,w,h,key){
    const t = FRAME_THEMES[key];
    t.paintBackground(ctx,w,h);
    if (t.swatchAccent) t.swatchAccent(ctx,w,h);
    const pw = w*0.66, ph = pw*0.76, px = (w-pw)/2;
    let py = h*0.12;
    const gap = h*0.03;
    for(let i=0;i<4;i++){
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillRect(px,py,pw,ph);
      ctx.strokeStyle = t.photoBorder;
      ctx.lineWidth = 2;
      ctx.strokeRect(px,py,pw,ph);
      py += ph+gap;
    }
  }

  function buildFrameGrid(){
    frameGrid.innerHTML = '';
    FRAME_LIST.forEach(f=>{
      const card = document.createElement('div');
      card.className = 'frame-card' + (f.key===currentFrameKey ? ' active' : '');
      card.dataset.key = f.key;
      const cv = document.createElement('canvas');
      cv.width = 96; cv.height = 128;
      drawThemeSwatch(cv.getContext('2d'), 96, 128, f.key);
      const span = document.createElement('span');
      span.textContent = f.label;
      card.appendChild(cv);
      card.appendChild(span);
      card.addEventListener('click', ()=>{
        currentFrameKey = f.key;
        frameGrid.querySelectorAll('.frame-card').forEach(c=>{
          c.classList.toggle('active', c.dataset.key === currentFrameKey);
        });
      });
      frameGrid.appendChild(card);
    });
  }

  let mascotImgPromise = null;
  function loadMascotImage(){
    if (!mascotImgPromise){
      mascotImgPromise = new Promise((resolve)=>{
        const img = new Image();
        img.onload = ()=>resolve(img);
        img.onerror = ()=>resolve(null);
        img.src = 'image.png';
      });
    }
    return mascotImgPromise;
  }

  // 마스코트 사진을 원본 비율 그대로, 지정한 높이에 맞춰 중앙 정렬로 그린다
  function drawMascotImg(ctx, img, cx, topY, targetH){
    if (!img) return;
    const ratio = (img.naturalWidth && img.naturalHeight) ? (img.naturalWidth/img.naturalHeight) : (208/283);
    const h = targetH, w = h * ratio;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.3)';
    ctx.shadowBlur = 8;
    ctx.drawImage(img, cx - w/2, topY, w, h);
    ctx.restore();
    return { w, h };
  }

  async function composeStrip(){
    await loadFont();
    const mascotImg = await loadMascotImage();
    const theme = FRAME_THEMES[currentFrameKey] || FRAME_THEMES.hwagae;
    const photoW = 480, photoH = 640, gap = 16, pad = 26;
    const headerH = 150, footerH = 128;
    const W = photoW + pad*2;
    const H = headerH + 4*photoH + 3*gap + footerH;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');

    theme.paintBackground(ctx, W, H);
    theme.paintHeader(ctx, W, headerH);

    let y = headerH;
    shots.forEach((shotCanvas)=>{
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.25)';
      ctx.shadowBlur = 12;
      ctx.drawImage(shotCanvas, pad, y, photoW, photoH);
      ctx.restore();
      ctx.strokeStyle = theme.photoBorder;
      ctx.lineWidth = 5;
      ctx.strokeRect(pad, y, photoW, photoH);
      y += photoH + gap;
    });

    const footerY = H - footerH;
    theme.paintFooter(ctx, W, footerY, footerH, mascotImg);

    resultDataUrl = cv.toDataURL('image/png');
    resultImg.src = resultDataUrl;
    saveStatus.textContent = '';
    show('result');
  }

  btnSave.addEventListener('click', async ()=>{
    if(!resultDataUrl) return;
    try{
      const res = await fetch(resultDataUrl);
      const blob = await res.blob();
      if (navigator.canShare && navigator.canShare({ files:[new File([blob],'hwagae-4cut.png',{type:'image/png'})] })){
        try{
          await navigator.share({ files:[new File([blob],'hwagae-4cut.png',{type:'image/png'})], title:'화개장터 네컷' });
          saveStatus.textContent = '공유 완료!';
          return;
        }catch(shareErr){ /* fall through to download */ }
      }
      const url = URL.createObjectURL(blob);
      dlLink.href = url;
      dlLink.click();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      saveStatus.textContent = '저장됐어요! (안 되면 사진을 길게 눌러 저장하세요)';
    }catch(e){
      saveStatus.textContent = '사진을 길게 눌러서 저장해주세요';
    }
  });

  btnRetake.addEventListener('click', ()=>{ show('home'); });
